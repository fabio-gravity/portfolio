{% extends "portfolio/base.html" %}

{% block content %}
<h2>Registo</h2>

<section>
    <article>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div style="margin-bottom: 15px;">
                    <label for="{{ field.id_for_label }}"><strong>{{ field.label }}</strong></label><br>
                    {{ field }}
                    {% if field.errors %}
                        <p style="color: red;">{{ field.errors }}</p>
                    {% endif %}
                    {% if field.help_text %}
                        <p style="font-size: 12px; color: gray;">{{ field.help_text }}</p>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit">Registar</button>
        </form>

        <p style="margin-top: 15px;">Já tem conta? <a href="{% url 'accounts:login' %}">Login</a></p>
    </article>
</section>
{% endblock %}
